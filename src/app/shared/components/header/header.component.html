<header class="rc-header">
  <div class="rc-header__bar">
    <a routerLink="/" class="rc-header__brand" (click)="closeMenu()">
      <span aria-hidden="true">🍲</span>
      <span class="rc-display">Caderno de Receitas</span>
    </a>

    <button
      class="rc-header__toggle"
      type="button"
      aria-label="Abrir menu de navegação"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? '✕' : '☰' }}
    </button>
  </div>

  <nav class="rc-header__nav" [class.rc-header__nav--open]="menuOpen()">
    <a routerLink="/receitas" routerLinkActive="is-active" (click)="closeMenu()">Explorar</a>

    @if (auth.isAuthenticated()) {
      <a routerLink="/minhas-receitas" routerLinkActive="is-active" (click)="closeMenu()">Minhas receitas</a>
      <a routerLink="/receitas/nova" routerLinkActive="is-active" (click)="closeMenu()">Nova receita</a>
      <a routerLink="/perfil" routerLinkActive="is-active" (click)="closeMenu()">Perfil</a>

      <div class="rc-header__user">
        <span class="rc-header__user-name">Olá, {{ auth.currentUser()?.name }}</span>
        <button class="btn btn-outline" type="button" (click)="logout()">Sair</button>
      </div>
    } @else {
      <a routerLink="/login" routerLinkActive="is-active" (click)="closeMenu()">Entrar</a>
      <a routerLink="/cadastro" (click)="closeMenu()">
        <button class="btn btn-secondary" type="button">Criar conta</button>
      </a>
    }
  </nav>
</header>
